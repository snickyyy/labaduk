# Production Nginx virtual host for Labaduk (Laravel 13 / PHP-FPM).
# Domain: lingking.space. Verify the PHP-FPM socket before enabling.

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    return 444;
}

server {
    listen 80;
    listen [::]:80;

    server_name lingking.space www.lingking.space;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    server_name _;

    ssl_certificate     /etc/letsencrypt/live/lingking.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lingking.space/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 444;
}

server {
    # Debian 13 ships Nginx 1.26, which supports the dedicated directive.
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name lingking.space www.lingking.space;

    root /var/www/labaduk/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/lingking.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lingking.space/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/lingking.space/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:labaduk_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;

    client_max_body_size 10m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 30s;

    limit_conn labaduk_connections 30;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; img-src 'self' data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src 'self'" always;

    access_log /var/log/nginx/labaduk.access.log;
    error_log  /var/log/nginx/labaduk.error.log warn;

    # Keep certificate renewal available over HTTPS as well.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    # Health endpoint is intended for local monitoring only. Add the private
    # address of a load balancer here if one is introduced later.
    location = /up {
        allow 127.0.0.1;
        allow ::1;
        deny all;

        try_files "" @laravel;
    }

    # Public appointment endpoints get dedicated, stricter limits.
    location = /api/appointments {
        limit_req zone=labaduk_appointments burst=5 nodelay;
        try_files "" @laravel;
    }

    location = /api/appointments/slots {
        limit_req zone=labaduk_api_read burst=20 nodelay;
        try_files "" @laravel;
    }

    # These limits complement Laravel Fortify's account-aware throttling.
    location ~ ^/(?:login|register|forgot-password|reset-password|two-factor-challenge|passkeys/login)/?$ {
        limit_req zone=labaduk_auth burst=5 nodelay;
        try_files "" @laravel;
    }

    # A request for "/" maps to the public directory itself. Send it straight
    # to Laravel so Nginx's index processing cannot internally request the
    # deliberately blocked /index.php URL.
    location = / {
        limit_req zone=labaduk_general burst=40 nodelay;
        try_files "" @laravel;
    }

    # Only immutable/public assets are served directly. Livewire and Flux
    # JavaScript endpoints keep flowing through Laravel.
    location ~* ^/(?:build|css|js|fonts|images)/.+\.(?:css|js|mjs|map|png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf)$ {
        try_files $uri =404;
        expires 7d;
        access_log off;
    }

    location / {
        limit_req zone=labaduk_general burst=40 nodelay;
        try_files $uri $uri/ @laravel;
    }

    # Never expose dotfiles, backups, database dumps, logs, or configuration.
    location ~ /\.(?!well-known(?:/|$)) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(?:bak|conf|env|ini|log|old|orig|sql|sqlite|swp|ya?ml)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # No user-controlled PHP path is ever passed to PHP-FPM.
    location ~ \.php(?:/|$) {
        return 404;
    }

    location @laravel {
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_param HTTP_PROXY "";

        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_connect_timeout 5s;
        fastcgi_send_timeout 60s;
        fastcgi_read_timeout 60s;
        fastcgi_hide_header X-Powered-By;
    }
}
