services:
    db:
        image: postgres:16.4-alpine
        environment:
            POSTGRES_DB: ${DB_DATABASE}
            POSTGRES_USER: ${DB_USERNAME}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            PGDATA: /data/postgres
        ports:
            # PostgreSQL is available to services on this VM, but is not
            # published on its external network interface.
            - "127.0.0.1:${DB_PORT:-5432}:5432"
        volumes:
            - db:/data/postgres

volumes:
    db: { }
