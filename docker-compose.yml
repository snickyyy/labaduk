services:
    db:
        image: postgres:16.4-alpine
        environment:
            POSTGRES_DB: ${DB_DATABASE}
            POSTGRES_USER: ${DB_USERNAME}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            PGDATA: /data/postgres
        ports:
            - "${DB_PORT}:5432"
        volumes:
            - db:/data/postgres

volumes:
    db: { }
